<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC0AC Weather Charts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
<script src="units.js"></script>
<style>
  :root {
    --bg: #000;
    --surface: #111;
    --border: #333;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #4af;
    --warn: #f44;
    --font: "Helvetica Neue", Helvetica, Arial, Roboto, "Liberation Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; padding: 16px;
         font-variant-numeric: tabular-nums; }
  h1 { font-size: 16px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; }
  h1 a { color: var(--accent); text-decoration: none; font-size: 14px; margin-left: 12px; letter-spacing: 0; }
  .ts { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 16px;
             position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0; }
  .buttons button { font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
                    border: 1px solid var(--border); padding: 6px 12px; cursor: pointer; }
  .buttons button:hover { border-color: var(--accent); }
  .buttons button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .buttons input { font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
                   border: 1px solid var(--border); padding: 5px 6px; color-scheme: dark; }
  #range { display: none; gap: 6px; align-items: center; }
  #range.on { display: flex; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
  .name { color: var(--accent); font-size: 13px; margin-bottom: 8px; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .totals div { border: 1px solid var(--border); padding: 8px; }
  .totals span { display: block; color: var(--muted); font-size: 12px; }
  .totals b { font-size: 22px; font-weight: 400; }
  #error { color: var(--warn); margin-bottom: 12px; }
  .u-legend { color: var(--text); font-size: 12px; }
  .u-legend .u-marker { width: 10px; height: 10px; }
  .u-select { background: rgba(68, 170, 255, 0.15); }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<h1><span id="title">CC0AC Weather</span> <a href="/">← now</a></h1>
<div class="ts" id="written">loading…</div>
<div class="buttons" id="periods">
  <button data-p="today">Today</button>
  <button data-p="24h">24 hours</button>
  <button data-p="week">Week</button>
  <button data-p="month">Month</button>
  <button data-p="year">Year</button>
  <button data-p="all">All time</button>
  <button data-p="range">Range</button>
  <span id="range"><input type="datetime-local" id="from"> to <input type="datetime-local" id="to"> <button id="go">Show</button></span>
</div>
<div id="error"></div>
<div id="charts"></div>

<script>
"use strict";
// One row of period buttons drives every chart. The period lives in the URL hash
// (#week, #range:2026-10-01T08:00/2026-10-08T17:30) so a chart view can be bookmarked
// or shared. An older #range:2026-10-01:2026-10-08 still works: whole days.
// The server groups readings into buckets sized to the period; see /history.json.

// Chart colors come from theme.css (--chart-1 … --chart-9 and the rest), so a
// restyle is one file. A page opened without it falls back to these.
const DEFAULT_COLORS = { "1": "#4af", "2": "#f90", "3": "#6d6", "4": "#f6c", "5": "#fd4", "6": "#a8f",
  "7": "#4dd", "8": "#f66", "9": "#ccc", axis: "#888", grid: "#222", band: "#2a5f8f",
  "band-fill": "rgba(68,170,255,0.12)", outdoor: "#fff", rain: "rgba(68,170,255,0.5)", strike: "#fd4" };
const css = getComputedStyle(document.documentElement);
const C = Object.fromEntries(Object.entries(DEFAULT_COLORS).map(
  ([k, v]) => [k, css.getPropertyValue(`--chart-${k}`).trim() || v]));
const COLORS = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(i => C[i]);
const REFRESH_MS = 5 * 60 * 1000;
const plots = [];
let current = null;

function hashPeriod() {
  const h = decodeURIComponent(location.hash.slice(1));
  const when = /^range:(\d{4}-\d\d-\d\dT\d\d:\d\d)\/(\d{4}-\d\d-\d\dT\d\d:\d\d)$/.exec(h);
  if (when) return { period: "range", from: when[1], to: when[2] };
  const days = /^range:(\d{4}-\d\d-\d\d):(\d{4}-\d\d-\d\d)$/.exec(h);
  if (days) return { period: "range", from: days[1], to: days[2] };
  return { period: ["today", "24h", "week", "month", "year", "all"].includes(h) ? h : "today" };
}

const pad = n => String(n).padStart(2, "0");
function localTime(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showButtons(p) {
  for (const b of document.querySelectorAll("#periods [data-p]")) b.classList.toggle("on", b.dataset.p === p.period);
  document.getElementById("range").classList.toggle("on", p.period === "range");
  if (p.period === "range") {   // a date alone is that whole day
    document.getElementById("from").value = p.from.length > 10 ? p.from : `${p.from}T00:00`;
    document.getElementById("to").value = p.to.length > 10 ? p.to : `${p.to}T23:59`;
  }
}

document.getElementById("periods").addEventListener("click", e => {
  const p = e.target.dataset && e.target.dataset.p;
  if (!p) return;
  if (p === "range") {
    const to = new Date(), from = new Date(Date.now() - 7 * 86400e3);
    showButtons({ period: "range", from: localTime(from), to: localTime(to) });
    return;
  }
  location.hash = p;
});
document.getElementById("go").addEventListener("click", () => {
  // A browser may add seconds; the hash keeps minutes.
  const from = document.getElementById("from").value.slice(0, 16), to = document.getElementById("to").value.slice(0, 16);
  if (from && to && from !== to) location.hash = `range:${from < to ? from : to}/${from < to ? to : from}`;
});
window.addEventListener("hashchange", load);

async function load() {
  const p = hashPeriod();
  showButtons(p);
  const q = p.period === "range" ? `from=${p.from}&to=${p.to}` : `period=${p.period}`;
  try {
    const r = await fetch(`/history.json?${q}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    current = await r.json();
    document.getElementById("error").textContent = "";
    draw(current);
  } catch (e) {
    document.getElementById("error").textContent = `Could not load history: ${e.message}`;
  }
}

function stepLabel(s) {
  if (s < 3600) return `${s / 60}-minute`;
  if (s < 86400) return s === 3600 ? "hourly" : `${s / 3600}-hour`;
  return s === 86400 ? "daily" : "weekly";
}

function width() {
  return document.getElementById("charts").clientWidth - 30;
}

function axes(left, right) {
  const base = { stroke: C.axis, grid: { stroke: C.grid }, ticks: { stroke: C.grid } };
  const a = [{ ...base }, { ...base, label: left, labelSize: 18, size: 55 }];
  if (right) a.push({ ...base, label: right, labelSize: 18, size: 55, side: 1, scale: "r", grid: { show: false } });
  return a;
}

function line(label, color, extra = {}) {
  return { label, stroke: color, width: 1.5, spanGaps: false, ...extra };
}

// Readings sanity.py held back: faded points, no line, pinned to the edge of what the
// believed readings span, so one 200 mph gust shows without flattening the chart.
// items: [label, values in the units shown, color, the believed series they sit among].
function withHeld(opts, data, items) {
  for (const [label, values, color, among] of items) {
    if (!values || !values.some(v => v != null)) continue;
    const seen = among.flat().filter(v => v != null);
    const lo = Math.min(...seen), hi = Math.max(...seen);
    opts.series.push({ label: `${label} held back`, stroke: color, alpha: 0.4, paths: () => null,
                       points: { show: true, size: 7, fill: color } });
    data.push(seen.length ? values.map(v => v == null ? null : Math.min(hi, Math.max(lo, v))) : values);
  }
  return [opts, data];
}

// The strike dots: from faint at the start of the period to solid at its end.
function drawStrikes(u, from, to) {
  const ctx = u.ctx, [t, mi, n] = u.data, b = u.bbox;
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.left, b.top, b.width, b.height);
  ctx.clip();
  ctx.fillStyle = C.strike;
  for (let i = 0; i < t.length; i++) {
    if (mi[i] == null) continue;
    const age = to > from ? Math.min(1, Math.max(0, (t[i] - from) / (to - from))) : 1;
    ctx.globalAlpha = 0.15 + 0.85 * age;
    ctx.beginPath();
    ctx.arc(u.valToPos(t[i], "x", true), u.valToPos(mi[i], "y", true),
            Math.min(10, 3 + 2 * Math.sqrt(n[i] - 1)) * devicePixelRatio, 0, 2 * Math.PI);
    ctx.fill();
  }
  ctx.restore();
}

function card(title, el) {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = `<div class="name">${title}</div>`;
  if (el) c.appendChild(el);
  document.getElementById("charts").appendChild(c);
  return c;
}

function plot(title, opts, data, before) {
  const c = card(title, before);
  const holder = document.createElement("div");
  c.appendChild(holder);
  plots.push(new uPlot({ width: width(), height: 260, cursor: { drag: { x: true } }, ...opts }, data, holder));
  return c;
}

// charts.html?chart=indoor&sensor=<ID>, as a dashboard card links here: that chart
// scrolled to (once, not on each refresh), and that sensor's line picked out, the
// others faded.
const QUERY = new URLSearchParams(location.search);
const PICKED = (QUERY.get("sensor") || "").toLowerCase();
let scrolledTo = false;

function roomLine(r, color, rooms) {
  if (!PICKED || !rooms.some(x => String(x.id).toLowerCase() === PICKED)) return line(r.name, color);
  return String(r.id).toLowerCase() === PICKED ? line(r.name, color, { width: 3 }) : line(r.name, color, { alpha: 0.3 });
}

function scrollToChart() {
  const key = QUERY.get("chart");
  if (scrolledTo || !key) return;
  scrolledTo = true;
  const c = document.querySelector(`#charts .card[data-chart="${CSS.escape(key)}"]`);
  if (c) c.scrollIntoView({ block: "start" });
}

function draw(d) {
  for (const p of plots) p.destroy();
  plots.length = 0;
  document.getElementById("charts").innerHTML = "";
  const span = d.to - d.from;
  const fmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium",
    timeStyle: span > 2 * 86400 && d.period !== "range" ? undefined : "short" });
  if (d.title) {
    document.getElementById("title").textContent = d.title;
    document.title = `${d.title} Charts`;
  }
  document.getElementById("written").textContent =
    `${fmt.format(new Date(d.from * 1000))} – ${fmt.format(new Date(d.to * 1000))} · ${stepLabel(d.step)} averages`;

  // Readings come in the stored units; shown in those [units] in config.ini chose (units.js).
  Units.use(d.units);
  const o = d.outdoor, t = d.t, h = d.held || {};
  const as = (kind, values) => (values || []).map(v => Units.value(kind, v));
  const deg = Units.label("temperature");

  const temps = [o.temp_f, o.temp_min, o.temp_max, o.dew_point_f, o.feels_like_f].map(v => as("temperature", v));
  plot(`Outdoor temperature ${deg}`, ...withHeld({
    axes: axes(deg),
    series: [{}, line("Temp", COLORS[0]), line("Low", C.band, { width: 1 }), line("High", C.band, { width: 1 }),
             line("Dew point", COLORS[2]), line("Feels like", COLORS[1], { dash: [4, 4] })],
    bands: [{ series: [3, 2], fill: C["band-fill"] }],
    scales: { x: { time: true } },
  }, [t, ...temps], [["Temp", as("temperature", h.temp_f), COLORS[0], temps]])).dataset.chart = "outdoor";

  const winds = [as("wind", o.wind_mph), as("wind", o.wind_gust_mph)];
  plot("Wind", ...withHeld({
    axes: axes(Units.label("wind"), "direction °"),
    series: [{}, line("Speed", COLORS[0]), line("Gust", COLORS[1], { width: 1 }),
             { label: "From", stroke: COLORS[2], scale: "r", paths: () => null, points: { show: true, size: 4, fill: COLORS[2] } }],
    scales: { r: { range: [0, 360] } },
  }, [t, ...winds, o.wind_dir_deg], [["Speed", as("wind", h.wind_mph), COLORS[0], winds],
                                     ["Gust", as("wind", h.wind_gust_mph), COLORS[1], winds]])).dataset.chart = "wind";

  const pressure = as("pressure", o.pressure_inhg);
  plot(`Pressure ${Units.label("pressure")}`, ...withHeld({
    axes: axes(Units.label("pressure")),
    series: [{}, line("Pressure", COLORS[0])],
  }, [t, pressure], [["Pressure", as("pressure", h.pressure_inhg), COLORS[0], [pressure]]])).dataset.chart = "pressure";

  const tot = d.rain_totals;
  const since = tot.since ? new Date(tot.since + "T00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "start";
  const totals = document.createElement("div");
  totals.className = "totals";
  totals.innerHTML = [["Today", tot.today], ["This week", tot.week], ["This month", tot.month],
                      ["This year", tot.year], [`Since ${since}`, tot.all]]
    .map(([k, v]) => `<div><span>${k}</span><b>${Units.text("rain", v)}</b></div>`).join("");
  const per = { 3600: "hour", 86400: "day", 604800: "week" }[d.rain.step] || `${d.rain.step / 3600} hours`;
  const rainUnit = Units.label("rain");
  plot(`Rain, ${rainUnit === "in" ? "inches" : rainUnit} per ${per}`, {
    axes: axes(rainUnit),
    series: [{}, { label: "Rain", stroke: COLORS[0], fill: C.rain,
                   paths: uPlot.paths.bars({ size: [1, Infinity], gap: 2, align: 1 }), points: { show: false } }],
    scales: { y: { range: (u, min, max) => [0, Math.max(Units.value("rain", 0.1), max * 1.1)] } },
  }, [d.rain.t, as("rain", d.rain.in)], totals).dataset.chart = "rain";

  plot("UV and light", ...withHeld({
    axes: axes("UV index", "lux"),
    series: [{}, line("UV", COLORS[3]), line("Light", COLORS[4], { scale: "r", width: 1 })],
    scales: { y: { range: (u, min, max) => [0, Math.max(11, max)] }, r: { range: (u, min, max) => [0, Math.max(1000, max)] } },
  }, [t, o.uv_index, o.light_lux], [["UV", h.uv_index, COLORS[3], [o.uv_index, [0, 11]]]])).dataset.chart = "light";

  // Lightning, with a lightning sensor: a dot for each strike, at its time and distance.
  // The older a dot, the fainter. Strikes the sensor heard between two readings share
  // a distance (it sends only the last one), so they are one bigger dot.
  const s = d.strikes;
  if (s && s.sensors) {
    const mi = s.mi.map(v => v == null ? null : Units.value("distance", v));
    const far = Math.max(Units.value("distance", s.ignore_beyond_mi != null ? s.ignore_beyond_mi : 25),
                         ...mi.filter(v => v != null));
    const total = s.n.reduce((a, b) => a + b, 0);
    const note = document.createElement("div");
    note.className = "ts";
    note.textContent = (total ? `${total} strike${total === 1 ? "" : "s"}` : "No strikes heard")
      + (s.ignore_beyond_mi != null ? `; strikes past ${Units.text("distance", s.ignore_beyond_mi)} are left out` : "");
    plot(`Lightning: strikes by distance (${Units.label("distance")})`, {
      axes: axes(Units.label("distance")),
      series: [{}, { label: "Distance", stroke: C.strike, paths: () => null, points: { show: false } },
               { label: "Strikes", stroke: C.strike, scale: "n", paths: () => null, points: { show: false } }],
      scales: { x: { time: true, range: () => [d.from, d.to] }, y: { range: () => [0, far * 1.05] }, n: {} },
      hooks: { draw: [u => drawStrikes(u, d.from, d.to)] },
    }, [s.t, mi, s.n], note).dataset.chart = "lightning";
  }

  const rooms = d.rooms, roomColor = i => COLORS[i % COLORS.length];
  const roomTemps = rooms.map(r => as("temperature", r.temp_f));
  plot(`Indoor temperature ${deg}`, ...withHeld({
    axes: axes(deg),
    series: [{}, ...rooms.map((r, i) => roomLine(r, roomColor(i), rooms))],
  }, [t, ...roomTemps], rooms.map((r, i) => [r.name, as("temperature", (r.held || {}).temp_f), roomColor(i), roomTemps]))).dataset.chart = "indoor";

  const hums = [o.humidity_pct, ...rooms.map(r => r.humidity_pct)];
  plot("Humidity %", ...withHeld({
    axes: axes("%"),
    series: [{}, line("Outdoor", C.outdoor, { width: 1, dash: [4, 4] }),
             ...rooms.map((r, i) => roomLine(r, roomColor(i), rooms))],
  }, [t, ...hums], [["Outdoor", h.humidity_pct, C.outdoor, hums],
                    ...rooms.map((r, i) => [r.name, (r.held || {}).humidity_pct, roomColor(i), hums])])).dataset.chart = "humidity";
  scrollToChart();
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => plots.forEach(p => p.setSize({ width: width(), height: 260 })), 150);
});
setInterval(() => { if (hashPeriod().period !== "range") load(); }, REFRESH_MS);
load();
</script>
</body>
</html>
