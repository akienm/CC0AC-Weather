<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<style>
  :root {
    --bg: #000;
    --surface: #111;
    --border: #333;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #4af;
    --warn: #f44;
    --font: "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; padding: 16px; }
  h1 { font-size: 16px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; }
  .ts { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .stale { color: var(--warn) !important; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 14px; }
  .card.outdoor { grid-column: 1 / -1; }
  .name { color: var(--accent); font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .big { font-size: 44px; line-height: 1.1; }
  .big small { font-size: 18px; color: var(--muted); }
  .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 16px; margin-top: 10px; }
  .row { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--border); padding: 2px 0; }
  .row span:first-child { color: var(--muted); }
  .low { color: var(--warn); }
  .wu { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); }
  .wu .name { padding: 14px 14px 0; }
  .wu a { color: var(--accent); }
  .wu iframe { display: block; width: 100%; height: 1400px; border: 0; background: #fff; }
  #error { color: var(--warn); margin-top: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>WEATHER</h1>
<div class="ts" id="written">waiting for data…</div>
<div class="grid" id="grid"></div>
<div id="error"></div>

<!-- Forecast, sunrise/moon, history and the rest: our station's own page on
     Weather Underground, which the hub uploads to directly. -->
<div class="wu">
  <div class="name"><span>Forecast &amp; more · Weather Underground</span>
    <a id="wu-link" target="_blank" rel="noopener">open ↗</a></div>
  <iframe id="wu-frame" loading="lazy" title="Weather Underground station page"></iframe>
</div>

<script>
// Data arrives as current.js (window.ACURITE_CURRENT = {...}), written beside this
// page by acurite-capture.py. A <script> tag can load it from a file:// URL or any
// static host, where fetch() would be blocked.
const REFRESH_SECONDS = 30;
const WU_STATION_URL = 'https://www.wunderground.com/weather/us/nm/silver-city/KNMSILVE90';
document.getElementById('wu-link').href = WU_STATION_URL;
document.getElementById('wu-frame').src = WU_STATION_URL;
const STALE_MINUTES = 10;

const CARDINALS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const card = d => CARDINALS[Math.round(Number(d) / 22.5) % 16];
const num = (v, places = 1) => v == null || v === '' ? '—' : Number(v).toFixed(places);

function age(iso) {
  const mins = (Date.now() - new Date(iso).getTime()) / 60000;
  const text = mins < 1 ? 'just now' : mins < 60 ? `${Math.round(mins)} min ago`
             : mins < 1440 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} d ago`;
  return { text, stale: mins > STALE_MINUTES };
}

function row(label, value) {
  return value.includes('—') ? '' : `<div class="row"><span>${label}</span><span>${value}</span></div>`;
}

function battery(f) {
  return f.battery && String(f.battery).toLowerCase() !== 'normal'
    ? `<span class="low">battery ${f.battery}</span>` : '';
}

function outdoorCard(s) {
  const f = s.fields, a = age(s.updated);
  return `<div class="card outdoor">
    <div class="name"><span>${s.name}</span><span class="${a.stale ? 'stale' : 'ts'}">${a.text}</span></div>
    <div class="big">${num(f.temp_f)}°<small>F</small></div>
    <div class="rows">
      ${row('Feels like', num(f.feels_like_f) + '°')}
      ${row('Humidity', num(f.humidity_pct, 0) + '%')}
      ${row('Dew point', num(f.dew_point_f) + '°')}
      ${row('Wind', f.wind_mph == null ? '—' : `${num(f.wind_avg_mph ?? f.wind_mph)} mph ${f.wind_dir_deg != null ? card(f.wind_dir_deg) : ''}`)}
      ${row('Gust', num(f.wind_gust_mph) + ' mph')}
      ${row('Pressure', num(f.pressure_inhg, 2) + ' inHg')}
      ${row('Rain today', num(f.rain_day_in, 2) + ' in')}
      ${row('Rain rate', num(f.rain_hour_in, 2) + ' in/h')}
      ${row('UV index', num(f.uv_index, 0))}
      ${row('Light', num(f.light_lux, 0) + ' lux')}
      ${row('Lightning', f.strike_count == null ? '—' : `${f.strike_count} strikes`)}
      ${row('Last strike', f.last_strike_mi == null ? '—' : `${f.last_strike_mi} mi`)}
    </div>
    <div style="margin-top:8px">${battery(f)}</div>
  </div>`;
}

function sensorCard(s) {
  const f = s.fields, a = age(s.updated);
  return `<div class="card">
    <div class="name"><span>${s.name}</span><span class="${a.stale ? 'stale' : 'ts'}">${a.text}</span></div>
    <div class="big">${num(f.temp_f)}°<small>F</small></div>
    <div class="rows">${row('Humidity', num(f.humidity_pct, 0) + '%')}</div>
    <div style="margin-top:8px">${battery(f)}</div>
  </div>`;
}

function render(data) {
  const outdoor = ['Atlas', 'Iris', '5N1'];
  const sensors = [...data.sensors].sort((x, y) =>
    (outdoor.includes(y.type) - outdoor.includes(x.type)) || x.name.localeCompare(y.name));
  document.getElementById('grid').innerHTML = sensors
    .map(s => outdoor.includes(s.type) ? outdoorCard(s) : sensorCard(s)).join('');
  const a = age(data.written);
  const w = document.getElementById('written');
  w.textContent = `updated ${a.text} · ${new Date(data.written).toLocaleString()}`;
  w.className = 'ts' + (a.stale ? ' stale' : '');
  document.getElementById('error').textContent = '';
}

function load() {
  const old = document.getElementById('data');
  if (old) old.remove();
  const tag = document.createElement('script');
  tag.id = 'data';
  tag.src = 'current.js?t=' + Date.now();
  tag.onload = () => window.ACURITE_CURRENT && render(window.ACURITE_CURRENT);
  tag.onerror = () => {
    document.getElementById('written').textContent = 'no readings received yet';
    document.getElementById('error').textContent =
      'current.js is missing. It appears beside this page once the hub has sent its first reading.';
  };
  document.head.appendChild(tag);
}

load();
setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
