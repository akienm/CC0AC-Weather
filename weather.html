<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<style>
  :root {
    --bg: #000;
    --surface: #111;
    --border: #333;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #4af;
    --warn: #f44;
    --font: "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; padding: 16px; }
  h1 { font-size: 16px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; }
  .ts { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .stale { color: var(--warn) !important; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 14px; }
  .card.outdoor { grid-column: 1 / -1; }
  .name { color: var(--accent); font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .big { font-size: 44px; line-height: 1.1; }
  .big small { font-size: 18px; color: var(--muted); }
  .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 20px; margin-top: 10px; }
  .row { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--border); padding: 2px 0; }
  .row span:first-child { color: var(--muted); white-space: nowrap; margin-right: 12px; }
  .row span:last-child { text-align: right; }
  .low { color: var(--warn); }
  .arrow { display: inline-block; font-size: 16px; line-height: 1; }
  .sky { display: flex; align-items: center; gap: 16px; }
  .sky .moon { font-size: 56px; line-height: 1; }
  .wu { display: none; margin-top: 16px; background: var(--surface); border: 1px solid var(--border); }
  .wu .name { padding: 14px 14px 0; }
  .wu a { color: var(--accent); }
  .wu iframe { display: block; width: 100%; height: 1400px; border: 0; background: #fff; }
  #error { color: var(--warn); margin-top: 16px; white-space: pre-wrap; }
  .card { min-width: 0; }
  .hour .ts, .name .ts, .days .ts { margin-bottom: 0; }
  .hours { display: flex; overflow-x: auto; gap: 2px; padding-bottom: 6px; }
  .hour { flex: 0 0 64px; text-align: center; padding: 6px 0; border-right: 1px dotted var(--border); }
  .hour .e { font-size: 24px; line-height: 1.3; }
  .hour .t { font-size: 18px; }
  .hour .day { color: var(--accent); }
  .pop { color: var(--accent); }
  .days details { border-bottom: 1px dotted var(--border); }
  .days summary { display: grid; grid-template-columns: 9em 2em 7em 4em 1fr; gap: 8px; align-items: center;
                  padding: 6px 0; cursor: pointer; list-style: none; }
  .days summary::-webkit-details-marker { display: none; }
  .days .e { font-size: 22px; }
  .days .sky-text { color: var(--muted); }
  .days .detail { color: var(--muted); padding: 0 0 8px 1em; }
  .days .detail p { margin-top: 4px; }
  @media (max-width: 560px) {
    .days summary { grid-template-columns: 6.5em 2em 6em 3.5em; }
    .days .sky-text { display: none; }
  }
  .more { background: none; border: 1px solid var(--border); color: var(--accent); font: inherit;
          font-size: 12px; padding: 2px 8px; cursor: pointer; }
  #alerts .alert { border: 2px solid #f90; background: #210; padding: 10px 14px; margin-bottom: 12px; }
  #alerts .alert.severe { border-color: var(--warn); background: #300; }
  #alerts summary { cursor: pointer; font-weight: bold; }
  #alerts .text { white-space: pre-wrap; margin-top: 8px; color: var(--text); }
</style>
</head>
<body>
<h1>WEATHER</h1>
<div class="ts" id="written">waiting for data…</div>
<div id="alerts"></div>
<div class="grid" id="grid"></div>
<div id="error"></div>

<!-- Forecast, history and the rest: the station's own page on
     Weather Underground. Shown only when the data file names a station
     ([weather_underground] station_id in config.ini). -->
<div class="wu">
  <div class="name"><span>Forecast &amp; more · Weather Underground</span>
    <a id="wu-link" target="_blank" rel="noopener">open ↗</a></div>
  <iframe id="wu-frame" loading="lazy" title="Weather Underground station page"></iframe>
</div>

<script>
// Data arrives as current.js (window.ACURITE_CURRENT = {...}), written beside this
// page by acurite-capture.py. A <script> tag can load it from a file:// URL or any
// static host, where fetch() would be blocked.
const REFRESH_SECONDS = 30;
const STALE_MINUTES = 10;

const CARDINALS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const card = d => CARDINALS[Math.round(Number(d) / 22.5) % 16];
const num = (v, places = 1) => v == null || v === '' ? '—' : Number(v).toFixed(places);
const clock = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// ── Forecast, airport observation and alerts: forecast.js (window.ACURITE_FORECAST),
// written by acurite-capture.py from the National Weather Service. Optional: the
// page works without it.

// The Weather Service's short forecast → one emoji. The first matching rule wins,
// and "X then Y" is read by its first half.
function skyEmoji(text, day, moonEmoji) {
  const t = String(text || '').split(' then ')[0].toLowerCase();
  if (/thunder/.test(t)) return '⛈️';
  if (/snow|flurr|blizzard|sleet|freezing|ice/.test(t)) return '🌨️';
  if (/rain|shower|drizzle/.test(t)) return /chance/.test(t) && day ? '🌦️' : '🌧️';
  if (/fog|haze|smoke|dust/.test(t)) return '🌫️';
  if (/overcast|^cloudy|mostly cloudy/.test(t)) return day && /mostly/.test(t) ? '🌥️' : '☁️';
  if (/partly/.test(t)) return day ? '⛅' : '☁️';
  if (/mostly (sunny|clear)/.test(t)) return day ? '🌤️' : (moonEmoji || '🌙');
  if (/sunny|clear|fair/.test(t)) return day ? '☀️' : (moonEmoji || '🌙');
  if (/wind|breezy|blustery/.test(t)) return '💨';
  return day ? '🌤️' : '☁️';
}

const cardinalDeg = c => CARDINALS.indexOf(c) * 22.5;
const popText = p => p != null && p >= 10 ? `<span class="pop">💧${p}%</span>` : '';
let showHours = 24;

function partAge(fc, part, iso) {
  const err = fc.errors && fc.errors[part];
  if (!iso && !err) return '';
  const a = iso ? age(iso) : null;
  const text = a ? `issued ${a.text}` : '';
  return err ? `<span class="stale" title="${err.replace(/"/g, '&quot;')}">${text} · last fetch failed</span>`
             : `<span class="ts">${text}</span>`;
}

function hourlyCard(fc, moonEmoji) {
  if (!fc.hourly) return '';
  const now = Date.now();
  const hours = fc.hourly.periods.filter(h => new Date(h.start).getTime() + 3600000 > now).slice(0, showHours);
  const cells = hours.map((h, i) => {
    const d = new Date(h.start);
    const label = i > 0 && d.getHours() === 0
      ? `<span class="day">${d.toLocaleDateString([], { weekday: 'short' })}</span>`
      : d.toLocaleTimeString([], { hour: 'numeric' });
    const w = h.wind_mph == null ? '' :
      `${h.wind_from ? windArrow(cardinalDeg(h.wind_from)) : ''} ${h.wind_mph}`;
    return `<div class="hour" title="${h.sky}">
      <div class="ts">${label}</div>
      <div class="e">${skyEmoji(h.sky, h.day, moonEmoji)}</div>
      <div class="t">${h.temp_f}°</div>
      <div>${popText(h.pop) || '&nbsp;'}</div>
      <div class="ts">${w}</div>
    </div>`;
  }).join('');
  const toggle = `<button class="more" onclick="showHours = showHours === 24 ? 48 : 24; renderAll()">${showHours === 24 ? '48 h' : '24 h'}</button>`;
  return `<div class="card outdoor">
    <div class="name"><span>Hourly ${toggle}</span>${partAge(fc, 'forecast', fc.hourly.updated)}</div>
    <div class="hours">${cells}</div>
  </div>`;
}

function dailyCard(fc, moonEmoji) {
  if (!fc.daily) return '';
  // Day and night halves, paired by date; the first day may be night only.
  const days = [];
  for (const p of fc.daily.periods) {
    const key = new Date(p.start).toDateString();
    let d = days.find(x => x.key === key);
    if (!d) days.push(d = { key });
    d[p.day ? 'day' : 'night'] = p;
  }
  const rows = days.map(d => {
    const lead = d.day || d.night;
    const hi = d.day ? `${d.day.temp_f}°` : '', lo = d.night ? `${d.night.temp_f}°` : '';
    const pop = Math.max(d.day?.pop ?? 0, d.night?.pop ?? 0);
    const name = d.day ? d.day.name : d.night.name;
    const detail = [d.day, d.night].filter(Boolean)
      .map(p => `<p><b>${p.name}:</b> ${p.detail}</p>`).join('');
    const open = (window.OPEN_DAYS || []).includes(name) ? ' open' : '';
    return `<details${open}><summary>
      <span>${name}</span>
      <span class="e">${skyEmoji(lead.sky, !!d.day, moonEmoji)}</span>
      <span>${hi}${hi && lo ? ' / ' : ''}<span class="ts">${lo}</span></span>
      <span>${popText(pop)}</span>
      <span class="sky-text">${lead.sky}</span>
    </summary><div class="detail">${detail}</div></details>`;
  }).join('');
  return `<div class="card outdoor days">
    <div class="name"><span>7 days · tap a day for detail</span>${partAge(fc, 'forecast', fc.daily.updated)}</div>
    ${rows}
  </div>`;
}

const CLOUD_WORDS = { FEW: 'few clouds', SCT: 'scattered clouds', BKN: 'broken clouds',
                      OVC: 'overcast', VV: 'sky obscured', CLR: 'clear', SKC: 'clear' };

function observationRows(fc) {
  const o = fc && fc.observation;
  if (!o) return '';
  const clouds = (o.clouds || []).map(c =>
    `${CLOUD_WORDS[c.amount] || c.amount}${c.base_ft != null ? ` at ${(Math.round(c.base_ft / 100) * 100).toLocaleString()} ft` : ''}`
  ).join(', ') || (o.sky ? '—' : '—');
  const where = `${o.name || o.station}, ${o.distance_mi} mi away · ${o.time ? age(o.time).text : ''}`;
  return `${row('👁️ Visibility', o.visibility_mi == null ? '—' : `${o.visibility_mi} mi`)}
      ${row('🌥️ Sky', o.sky || '—')}
      ${row('☁️ Clouds', clouds)}
      <div class="ts" style="grid-column: 1 / -1">visibility and clouds from ${where}; cloud heights are above the airport</div>`;
}

function renderAlerts(fc) {
  const box = document.getElementById('alerts');
  const list = (fc && fc.alerts) || [];
  box.innerHTML = list.map(a => {
    const severe = a.severity === 'Extreme' || a.severity === 'Severe';
    const until = a.ends ? ` · until ${new Date(a.ends).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}` : '';
    return `<details class="alert${severe ? ' severe' : ''}"><summary>⚠️ ${a.event}${until}</summary>
      <div class="text">${[a.headline, a.description, a.instruction].filter(Boolean).join('\n\n')}</div></details>`;
  }).join('');
}

// ── Sun and moon, computed here from the station's position: no outside service.
// Sunrise equation (as in NOAA's simplified solar calculator), good to a minute or
// two; the moon is its mean phase, good to about half a day.
const RAD = Math.PI / 180;
const sin = d => Math.sin(d * RAD), cos = d => Math.cos(d * RAD);

function sunTimes(day, lat, lon) {
  const noon = new Date(day); noon.setHours(12, 0, 0, 0);
  const n = Math.round(noon.getTime() / 86400000 + 2440587.5 - 2451545.0);
  const j = n - lon / 360;
  const m = (357.5291 + 0.98560028 * j) % 360;
  const l = (m + 1.9148 * sin(m) + 0.02 * sin(2 * m) + 0.0003 * sin(3 * m) + 282.9372) % 360;
  const transit = 2451545 + j + 0.0053 * sin(m) - 0.0069 * sin(2 * l);
  const sinDec = sin(l) * sin(23.4397);
  const cosDec = Math.sqrt(1 - sinDec * sinDec);
  // -0.833° is the standard horizon (refraction + the sun's radius), as published
  // tables use. No elevation dip: that correction is for height above the
  // surrounding land, and a town at 6,000 ft sits on land at 6,000 ft.
  const cosW = (sin(-0.833) - sin(lat) * sinDec) / (cos(lat) * cosDec);
  const toDate = jd => new Date((jd - 2440587.5) * 86400000);
  if (cosW > 1) return { polar: 'night' };
  if (cosW < -1) return { polar: 'day' };
  const w = Math.acos(cosW) / RAD / 360;
  return { rise: toDate(transit - w), set: toDate(transit + w) };
}

const SYNODIC = 29.530588853;
const MOONS = [['🌑', 'New moon'], ['🌒', 'Waxing crescent'], ['🌓', 'First quarter'],
  ['🌔', 'Waxing gibbous'], ['🌕', 'Full moon'], ['🌖', 'Waning gibbous'],
  ['🌗', 'Last quarter'], ['🌘', 'Waning crescent']];

function moon(now) {
  const days = now.getTime() / 86400000 - Date.UTC(2000, 0, 6, 18, 14) / 86400000;
  const frac = ((days % SYNODIC) + SYNODIC) % SYNODIC / SYNODIC;
  const [emoji, name] = MOONS[Math.floor(frac * 8 + 0.5) % 8];
  return { emoji, name, lit: (1 - Math.cos(2 * Math.PI * frac)) / 2,
           toFull: ((1.5 - frac) % 1) * SYNODIC, toNew: (1 - frac) * SYNODIC };
}

function sky(station) {
  if (!station || station.latitude == null) return null;
  const now = new Date(), sun = sunTimes(now, station.latitude, station.longitude);
  const up = sun.polar ? sun.polar === 'day' : now >= sun.rise && now < sun.set;
  return { sun, up, moon: moon(now) };
}

function skyCard(station, s) {
  if (!s) return '';
  const { sun, moon: mo } = s;
  const length = sun.polar ? '—' : (() => {
    const mins = Math.round((sun.set - sun.rise) / 60000);
    return `${Math.floor(mins / 60)} h ${mins % 60} min`;
  })();
  const days = d => d < 1.5 ? 'about a day' : `about ${Math.round(d)} days`;
  const ns = (v, p, n) => `${Math.abs(v).toFixed(3)}° ${v >= 0 ? p : n}`;
  return `<div class="card outdoor">
    <div class="name"><span>Sun &amp; moon</span><span class="ts">${s.up ? '☀️ sun is up' : '🌙 sun is down'}</span></div>
    <div class="sky">
      <div class="moon">${mo.emoji}</div>
      <div>${mo.name} · ${Math.round(mo.lit * 100)}% lit<br>
        <span class="ts">full moon in ${days(mo.toFull)} · new moon in ${days(mo.toNew)}</span></div>
    </div>
    <div class="rows">
      ${row('🌅 Sunrise', sun.polar ? (sun.polar === 'day' ? 'sun stays up' : 'sun stays down') : clock(sun.rise))}
      ${row('🌇 Sunset', sun.polar ? '—' : clock(sun.set))}
      ${row('⏳ Daylight', length)}
      ${row('📍 Latitude', ns(station.latitude, 'N', 'S'))}
      ${row('📍 Longitude', ns(station.longitude, 'E', 'W'))}
      ${row('⛰️ Elevation', station.elevation_ft == null ? '—' : `${Math.round(station.elevation_ft).toLocaleString()} ft`)}
      ${observationRows(window.ACURITE_FORECAST)}
    </div>
  </div>`;
}

// Wind: the arrow points the way the wind is blowing; the text says where it comes from.
const windArrow = deg => `<span class="arrow" style="transform: rotate(${Number(deg)}deg)">↓</span>`;

function uvLevel(v) {
  if (v == null || v === '') return '—';
  const n = Number(v);
  const word = n < 3 ? 'low' : n < 6 ? 'moderate' : n < 8 ? 'high' : n < 11 ? 'very high' : 'extreme';
  return `${n.toFixed(0)} ${word}`;
}

// Forecasters call a 3-hour change under 0.02 inHg steady.
function trend(change) {
  if (change == null) return '';
  const c = Number(change);
  return Math.abs(c) < 0.02 ? ' → steady' : c > 0 ? ` ↗ +${c.toFixed(2)}` : ` ↘ ${c.toFixed(2)}`;
}

function age(iso) {
  const mins = (Date.now() - new Date(iso).getTime()) / 60000;
  const text = mins < 1 ? 'just now' : mins < 60 ? `${Math.round(mins)} min ago`
             : mins < 1440 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} d ago`;
  return { text, stale: mins > STALE_MINUTES };
}

function row(label, value) {
  return value.includes('—') ? '' : `<div class="row"><span>${label}</span><span>${value}</span></div>`;
}

function battery(f) {
  return f.battery && String(f.battery).toLowerCase() !== 'normal'
    ? `<span class="low">🪫 battery ${f.battery}</span>` : '';
}

function wind(f) {
  if (f.wind_mph == null) return '—';
  const speed = num(f.wind_avg_mph ?? f.wind_mph);
  return f.wind_dir_deg == null ? `${speed} mph` : `${speed} mph from ${card(f.wind_dir_deg)} ${windArrow(f.wind_dir_deg)}`;
}

function outdoorCard(s, data, sk) {
  const f = s.fields, a = age(s.updated);
  const icon = sk ? (sk.up ? '☀️' : sk.moon.emoji) + ' ' : '';
  return `<div class="card outdoor">
    <div class="name"><span>${s.name}</span><span class="${a.stale ? 'stale' : 'ts'}">${a.text}</span></div>
    <div class="big">${icon}${num(f.temp_f)}°<small>F</small></div>
    <div class="rows">
      ${row('🌡️ Feels like', num(f.feels_like_f) + '°')}
      ${row('💧 Humidity', num(f.humidity_pct, 0) + '%')}
      ${row('🌫️ Dew point', num(f.dew_point_f) + '°')}
      ${row('💨 Wind', wind(f))}
      ${row('🌬️ Gust', num(f.wind_gust_mph) + ' mph')}
      ${row('⏲️ Pressure', num(f.pressure_inhg, 2) + ' inHg' + trend(data.pressure_change_3h))}
      ${row('☔ Rain today', num(f.rain_day_in, 2) + ' in')}
      ${row('🌧️ Rain rate', num(f.rain_hour_in, 2) + ' in/h')}
      ${row('🔆 UV index', uvLevel(f.uv_index))}
      ${row('☀️ Light', num(f.light_lux, 0) + ' lux')}
      ${row('⚡ Lightning', f.strike_count == null ? '—' : `${f.strike_count} strikes`)}
      ${row('⚡ Last strike', f.last_strike_mi == null ? '—' : `${f.last_strike_mi} mi`)}
    </div>
    <div style="margin-top:8px">${battery(f)}</div>
  </div>`;
}

function sensorCard(s) {
  const f = s.fields, a = age(s.updated);
  return `<div class="card">
    <div class="name"><span>${s.name}</span><span class="${a.stale ? 'stale' : 'ts'}">${a.text}</span></div>
    <div class="big">${num(f.temp_f)}°<small>F</small></div>
    <div class="rows">
      ${row('💧 Humidity', num(f.humidity_pct, 0) + '%')}
      ${row('🌫️ Dew point', num(f.dew_point_f) + '°')}
    </div>
    <div style="margin-top:8px">${battery(f)}</div>
  </div>`;
}

function showWu(url) {
  const pane = document.querySelector('.wu');
  if (!url) { pane.style.display = 'none'; return; }
  const frame = document.getElementById('wu-frame');
  if (frame.src !== url) { frame.src = url; document.getElementById('wu-link').href = url; }
  pane.style.display = 'block';
}

function renderAll() {
  if (window.ACURITE_CURRENT) render(window.ACURITE_CURRENT);
}

function render(data) {
  showWu(data.wu_url);
  const outdoor = ['Atlas', 'Iris', '5N1'];
  const sensors = [...data.sensors].sort((x, y) =>
    (outdoor.includes(y.type) - outdoor.includes(x.type)) || x.name.localeCompare(y.name));
  const sk = sky(data.station);
  const cards = sensors.map(s => outdoor.includes(s.type) ? outdoorCard(s, data, sk) : sensorCard(s));
  // The sun & moon card follows the outdoor card(s), before the rooms.
  // Then the forecast, hourly first, then the days, then the sun & moon card.
  const fc = window.ACURITE_FORECAST || {};
  const moonEmoji = sk ? sk.moon.emoji : null;
  cards.splice(sensors.filter(s => outdoor.includes(s.type)).length, 0,
               hourlyCard(fc, moonEmoji), dailyCard(fc, moonEmoji), skyCard(data.station, sk));
  renderAlerts(fc);
  document.getElementById('grid').innerHTML = cards.join('');
  const a = age(data.written);
  const w = document.getElementById('written');
  w.textContent = `updated ${a.text} · ${new Date(data.written).toLocaleString()}`;
  w.className = 'ts' + (a.stale ? ' stale' : '');
  document.getElementById('error').textContent = '';
}

function loadForecast() {
  const old = document.getElementById('forecast');
  if (old) old.remove();
  const tag = document.createElement('script');
  tag.id = 'forecast';
  tag.src = 'forecast.js?t=' + Date.now();
  tag.onload = renderAll;           // missing forecast.js is fine: the panes stay away
  document.head.appendChild(tag);
}

function load() {
  // Keep any open day open across the refresh.
  const open = [...document.querySelectorAll('.days details[open] summary span:first-child')].map(e => e.textContent);
  window.OPEN_DAYS = open;
  const old = document.getElementById('data');
  if (old) old.remove();
  const tag = document.createElement('script');
  tag.id = 'data';
  tag.src = 'current.js?t=' + Date.now();
  tag.onload = () => window.ACURITE_CURRENT && render(window.ACURITE_CURRENT);
  tag.onerror = () => {
    document.getElementById('written').textContent = 'no readings received yet';
    document.getElementById('error').textContent =
      'current.js is missing. It appears beside this page once the hub has sent its first reading.';
  };
  document.head.appendChild(tag);
}

load();
loadForecast();
setInterval(load, REFRESH_SECONDS * 1000);
setInterval(loadForecast, 5 * 60 * 1000);
</script>
</body>
</html>
